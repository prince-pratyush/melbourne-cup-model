[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "melbourne-cup-model"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2", "pydantic>=2.10,<3"]

[project.optional-dependencies]
trees = ["catboost>=1.2.8,<2"]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
cup-model = "cup_model.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cup_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
